version: '3.9'

services:
  backend:
    image: growlab
    build: .
    env_file:
      - .env
    environment:
      REDIS_URI: redis://redis:6379  # connect to the Redis container
    ports:
      - "8989:8989"
    volumes:
      - .:/growlab
    command: uvicorn app.main:app --host 0.0.0.0 --port 8989 --reload
    depends_on:
      - redis

  redis:
    image: redis:7.0-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
